<body>
  <h2>Program Hitung Umur</h2>
  <label for="tahun">Masukkan Tahun Lahir:</label>
  <input type="number" id="tahun" placeholder="contoh: 2000">
  <button onclick="hitungUmur ()">Hitung</button>

  <p id="hasil"></p>

  <script>
    function hitungUmur() {
        let hasilElement = document.getElementById("hasil");
        let tahunLahir = document.getElementById("tahun").value;
        let tahunSekarang = new Date().getFullYear();

        if (tahunLahir === "") {
            hasilElement.innerHTML = "Tolong masukkan tahun lahir Anda.";
            hasilElement.className = "error";
            return;
        }

        let tahunLahirInt = parseInt(tahunLahir);

        if (tahunLahirInt > tahunSekarang) {
            alert("Jangan kegedean mas kalo tahun lahir lebih gede dari tahun sekarang");
            hasilElement.innerHTML = "Jangan kegedean mas kalo tahun lahir lebih gede dari tahun sekarang";
            hasilElement.className = "error";
            return;
        }

        let umur = tahunSekarang - tahunLahirInt;
        hasilElement.innerHTML = "Umur kamu sekarang adalah " + umur + " tahun.";
      }
  </script>
  <h2>Penentu Nilai Huruf</h2>
  <br>
  <label for="nilai">Masukkan Nilai  (0-100):</label>
  <input type="number" id="nilai" placeholder="contoh: 85">
  <button onclick="tentukanNilaiHuruf()">Tentukan</button>

  <p id="hasilNilai"></p>

  <script>
    function tentukanNilaiHuruf() {
        let hasilNilaiElement = document.getElementById("hasilNilai");
        let nilai = document.getElementById("nilai").value;

        if (nilai === "") {
            hasilNilaiElement.innerHTML = "Tolong masukkan nilai Anda.";
            hasilNilaiElement.className = "error";
            return;
        }

        let nilaiInt = parseInt(nilai);

        if (nilaiInt < 0 || nilaiInt > 100) {
            alert("Masukkan nilai antara 0 hingga 100.");
            hasilNilaiElement.innerHTML = "Masukkan nilai antara 0 hingga 100.";
            hasilNilaiElement.className = "error";
            return;
        }

        let huruf;

        if (nilaiInt >= 90) {
            huruf = "A";
        } else if (nilaiInt >= 80) {
            huruf = "B";
        } else if (nilaiInt >= 70) {
            huruf = "C";
        } else if (nilaiInt >= 60) {
            huruf = "D";
        } else {
            huruf = "E";
        }

        let keterangan;

        switch (huruf) {
            case "A":
                keterangan = "Boleh Banget";
                break;
            case "B":
                keterangan = "Lumayan";
                break;
            case "C":
                keterangan = "Cukup";
                break;
            case "D":
                keterangan = "Perlu Belajar Lagi";
                break;
            default:
                keterangan = "Ngawur";
        }

        let pesan = "Nilai huruf Anda adalah " + huruf + " - " + keterangan;
        hasilNilaiElement.innerHTML = pesan;
        alert(pesan);
    }
  </script>

   <h2>Program Tahun Kabisat</h2>
   <br>
   <label for="tahunKabisat">Masukkan Tahun:</label>
   <input type="number" id="tahunKabisat" placeholder="contoh: 2024">
   <button onclick="cekTahunKabisat()">Cek</button>

   <p id="hasilKabisat"></p>

    <script>
      function cekTahunKabisat() {
            let hasilKabisatElement = document.getElementById("hasilKabisat");
            let tahun = document.getElementById("tahunKabisat").value;
    
            if (tahun === "") {
                 hasilKabisatElement.innerHTML = "Tolong masukkan tahun.";
                 hasilKabisatElement.className = "error";
                 alert("Tolong masukkan tahun.");
                 return;
            }
    
            let tahunInt = parseInt(tahun);
    
            if ((tahunInt % 4 === 0 && tahunInt % 100 !== 0) || (tahunInt % 400 === 0)) {
                 hasilKabisatElement.innerHTML = tahunInt + " adalah tahun kabisat.";
            } else {
                 hasilKabisatElement.innerHTML = tahunInt + " bukan tahun kabisat.";
            }

            let tahunSekarang = new Date().getFullYear();
            let infoUmur = tahunInt <= tahunSekarang
                ? "\nPerkiraan umur berdasarkan tahun tersebut: " + (tahunSekarang - tahunInt) + " tahun."
                : "\nUmur belum dapat dihitung karena tahun tersebut berada di masa depan.";

            alert(
                hasilKabisatElement.innerHTML +
                infoUmur +
                "\n\nOperator logika yang digunakan:" +
                "\n&& berarti kedua syarat harus benar." +
                "\n|| berarti salah satu syarat harus benar."
            );
      }
    </script>
</body>
